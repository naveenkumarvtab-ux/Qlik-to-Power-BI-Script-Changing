[server]
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
headless = true
address = "0.0.0.0"
maxUploadSize = 500
maxMessageSize = 500

[logger]
level = "debug"

# Render deployment: These settings ensure file uploads work through proxies
# The command-line flags also set these, but config.toml acts as a fallback.
